<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><link rel="stylesheet" href="/styles.css?v=141"><link rel="icon" href="/icon.svg"><title>Join Align</title></head><body><div class="app-shell"><header class="app-header"><a class="brand" href="/login"><span class="brand-mark">A</span><span>Align <small>V3.0</small></span></a></header><main><section class="page"><div class="hero"><p class="eyebrow">Your invitation</p><h1>Create your Align password</h1><p class="subtle">Use the email address and one-time invite code from your invitation.</p></div><form class="card settings-form" action="/invite-complete" method="post" id="invite-form"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Invite code</label><input name="invite_code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required placeholder="ALIGN-XXXX-XXXX-XXXX"></div><div class="field"><label>Create password</label><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><div class="field"><label>Confirm password</label><input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><p class="helper">10–128 characters · at least one letter · at least one number · <strong>no spaces</strong>. Symbols are fine.</p><p id="message" class="helper"></p><button class="primary-button" type="submit">Create account</button><a class="text-button" href="/login">Back to sign in</a></form></section></main></div><script src="/beta-invite.js?v=156-v25"></script></body></html>
