name: Align Management Studio Windows package
on:
  push:
    branches: [codex/align-v3-rebuild]
  pull_request:
    branches: [codex/align-v3-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out Align
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: studio-launcher/go.mod
      - name: Test and build desktop launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Push-Location "studio-launcher"
          go test ./...
          go build -trimpath -ldflags="-s -w" -o "..\dist\Align-Management-Studio.exe" .
          Pop-Location
      - name: Install local Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $candidates = @(
            "$env:ProgramFiles\Tesseract-OCR",
            "${env:ProgramFiles(x86)}\Tesseract-OCR"
          ) | Where-Object { Test-Path (Join-Path $_ "tesseract.exe") }
          $root = $candidates | Select-Object -First 1
          if (-not $root) { throw "Tesseract OCR was not installed." }
          if (-not (Test-Path (Join-Path $root "tessdata\eng.traineddata"))) { throw "English OCR model is missing." }
          "TESSERACT_INSTALL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the desktop programme and build the Windows package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          python -m unittest test_desktop_programme.py
          python -m PyInstaller --noconfirm --clean desktop/align.spec
          if (-not (Test-Path "dist\Align\Align.exe")) { throw "Align.exe was not built" }
          if (-not (Test-Path "dist\Align\ocr\tesseract.exe")) { throw "The package is missing its bundled OCR engine" }
          if (-not (Test-Path "dist\Align\ocr\tessdata\eng.traineddata")) { throw "The package is missing the English OCR model" }
          Copy-Item "static/icons/align.ico" "dist/Align/align.ico" -Force
      - name: Assemble installer package
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist/Align-Management-Studio"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/Align" $root -Recurse
          Copy-Item "installer/windows/Install-Align-Studio.ps1" $root
          Copy-Item "installer/windows/Launch-Align-Studio.ps1" $root
          Copy-Item "installer/windows/README.md" $root
          Copy-Item "desktop/README.md" (Join-Path $root "BUILD.md")
          Compress-Archive -Path $root -DestinationPath "$PWD/dist/Align-Management-Studio-Windows.zip" -Force
      - name: Upload Windows installer package
        uses: actions/upload-artifact@v4
        with:
          name: Align-Management-Studio-Windows
          path: dist/Align-Management-Studio-Windows.zip
          retention-days: 90
