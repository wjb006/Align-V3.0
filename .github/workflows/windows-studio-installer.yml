name: Align Management Studio Windows package
on:
  push:
    branches: [codex/align-v3-rebuild]
  pull_request:
    branches: [codex/align-v3-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out Align
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: studio-launcher/go.mod
      - name: Test and build desktop launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Push-Location "studio-launcher"
          go test ./...
          go build -trimpath -ldflags="-s -w" -o "..\dist\Align-Management-Studio.exe" .
          Pop-Location
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned local OCR engine
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 -y --no-progress
      - name: Test the desktop programme and build the Windows package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          python -m unittest test_desktop_programme.py test_desktop_auth.py test_desktop_auth_http.py test_work_rota_import.py
          node --check static/work-rota.js
          node --check static/work-setup.js
          node --check static/desktop-login.js
          python -m PyInstaller --noconfirm --clean desktop/align.spec
          if (-not (Test-Path "dist\Align\Align.exe")) { throw "Align.exe was not built" }
          Copy-Item "static/icons/align.ico" "dist/Align/align.ico" -Force
          $tesseract = Join-Path $env:ProgramFiles "Tesseract-OCR"
          if (-not (Test-Path (Join-Path $tesseract "tesseract.exe"))) { throw "Pinned Tesseract OCR runtime was not installed" }
          New-Item -ItemType Directory -Force -Path "dist/Align/tesseract" | Out-Null
          Copy-Item (Join-Path $tesseract "*") "dist/Align/tesseract" -Recurse -Force
      - name: Assemble installer package
        shell: pwsh
        run: |
          $root = Join-Path $PWD "dist/Align-Management-Studio"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/Align" $root -Recurse
          Copy-Item "installer/windows/Install-Align-Studio.ps1" $root
          Copy-Item "installer/windows/Launch-Align-Studio.ps1" $root
          Copy-Item "installer/windows/README.md" $root
          Copy-Item "desktop/README.md" (Join-Path $root "BUILD.md")
          Compress-Archive -Path $root -DestinationPath "$PWD/dist/Align-Management-Studio-Windows.zip" -Force
      - name: Upload Windows installer package
        uses: actions/upload-artifact@v4
        with:
          name: Align-Management-Studio-Windows
          path: dist/Align-Management-Studio-Windows.zip
          retention-days: 90
