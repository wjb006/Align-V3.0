name: Hosted persistence
on:
  pull_request:
    branches: [codex/align-v3-rebuild]
  push:
    branches: [codex/align-v3-rebuild]
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: align_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: align_persistence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align_test -d align_persistence_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify fresh V3 PostgreSQL schema and read-only preflight
        env:
          PGPASSWORD: local_test_only
        run: |
          createdb -h 127.0.0.1 -U align_test align_schema_preflight
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U align_test -d align_schema_preflight -f migrations/postgres/fresh_v3_schema.sql
          psql -X -A -t -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U align_test -d align_schema_preflight -f migrations/postgres/HOSTED_SCHEMA_PREFLIGHT.sql | tee /tmp/align-schema-preflight.txt
          if grep -q '^missing required' /tmp/align-schema-preflight.txt; then
            echo "Schema preflight reported missing tables or columns."
            exit 1
          fi
          if grep -Eq '^legacy_table_.*\|1$' /tmp/align-schema-preflight.txt; then
            echo "Fresh V3 schema unexpectedly contains a retired schedule table."
            exit 1
          fi
          for marker in 149_asset_studio 149_transport 150_calendar_links 151_sections 152_personal_item_calendars 153_hosted_travel_and_calendar_location 154_user_favourites_contacts; do
            if ! grep -Fxq "${marker}|1" /tmp/align-schema-preflight.txt; then
              echo "Expected exactly one migration marker for ${marker}."
              exit 1
            fi
          done
      - name: Local SQLite regressions and hosted Postgres integration
        env:
          ALIGN_TEST_POSTGRES_URL: postgresql://align_test:local_test_only@127.0.0.1:5432/align_persistence_test
        run: python -m pytest -q
