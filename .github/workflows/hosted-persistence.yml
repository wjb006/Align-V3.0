name: Hosted persistence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: align_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: align_persistence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U align_test -d align_persistence_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Local SQLite regressions and hosted Postgres integration
        env:
          ALIGN_TEST_POSTGRES_URL: postgresql://align_test:local_test_only@127.0.0.1:5432/align_persistence_test
        run: python -m pytest -q
