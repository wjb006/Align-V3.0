services:
  - type: web
    name: align-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALIGN_HOSTING_MODE
        value: persistent
      - key: ALIGN_DATABASE_BACKEND
        value: postgres
      - key: ALIGN_BETA_MODE
        value: "1"
      # Hosted journeys use the existing HERE account. render_start.py enables
      # transport only when Postgres, HERE transit and the server-side key exist.
      - key: ALIGN_JOURNEY_PROVIDER
        value: here
      - key: ALIGN_HERE_TRANSIT_ENABLED
        value: "1"
      - key: ALIGN_HERE_ROUTING_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ALIGN_ASSET_BUCKET
        sync: false
      - key: ALIGN_PREVIEW_PASSWORD
        sync: false
      - key: ALIGN_CREDENTIAL_KEY
        sync: false
      - key: ALIGN_PUBLIC_URL
        value: https://getalign.co.uk
