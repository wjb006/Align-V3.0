services:
  - type: web
    name: align-v3
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ALIGN_HOSTING_MODE
        value: persistent
      - key: ALIGN_DATABASE_BACKEND
        value: postgres
      - key: ALIGN_BETA_MODE
        value: "1"
      - key: ALIGN_TRANSPORT_ENABLED
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: ALIGN_PREVIEW_PASSWORD
        sync: false
      - key: ALIGN_CREDENTIAL_KEY
        sync: false
      - key: ALIGN_PUBLIC_URL
        value: https://getalign.co.uk
