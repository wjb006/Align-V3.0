  <g fill="url(#pn-cloud)">
    <ellipse cx="36" cy="42" rx="16" ry="11"/>
    <ellipse cx="24" cy="44" rx="10" ry="8"/>
    <ellipse cx="48" cy="44" rx="9" ry="7"/>
