      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#061326" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

      name="apple-mobile-web-app-title"
      content="Align"
    />

      href="/manifest.json?v=158-v94"

    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />

    />

    <title>Align V3.0 — Personal organiser</title>
  </head>

  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a
          class="brand"
          href="#home"
          aria-label="Align home"
        >
          <span class="brand-logo-crop"><img src="/icons/align-brand.png" alt="" width="44" height="44" /></span>
          <span class="brand-wordmark">
            Align
            <small>V3.0</small>
          </span>
        </a>

        <div class="header-tools">
          <button
            type="button"
            id="connection-status"
            class="connection-status"
            aria-label="Open offline diagnostics"
            title="Offline status"
            hidden
          ></button>

          <button
            type="button"
            class="header-action header-install"
            id="install-button"
            aria-label="Install Align"
            title="Install Align"
            hidden
          >
            Install
          </button>
          <a class="header-action" href="/phone-notifications.html" aria-label="Phone notifications" title="Phone notifications">🔔</a>
        </div>
      </header>

      <main
        id="app"
        tabindex="-1"
        aria-live="polite"
      ></main>

      <nav
        class="tab-bar"
        aria-label="Main navigation"
        id="bottom-navigation"
      ></nav>
    </div>

    <div id="modal-root"></div>

    <div
      id="toast"
      role="status"
      aria-live="polite"
    ></div>

    <link rel="stylesheet" href="/events-global.css?v=158-v94">

    <script src="/journey-breakdown.js?v=158-v94"></script>
    <script src="/personal-planner.js?v=158-v94"></script>
    <script src="/travel-assets.js?v=158-v94"></script>
    <script src="/post-event-travel.js?v=158-v94"></script>
    <script src="/work-setup.js?v=158-v94"></script>
    <script src="/shift-planner.js?v=158-v94"></script>
    <script src="/work-rota.js?v=158-v94"></script>
    <script src="/finance.js?v=158-v94"></script>
    <script src="/app.js?v=158-v94"></script>
    <script src="/desktop-update.js?v=158-v94"></script>
    <script src="/section-guide.js?v=158-v94"></script>
    <script src="/build152.js?v=158-v94"></script>
