<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f7f8fc" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Align"
    />

    <link
      rel="manifest"
      href="/manifest.json?v=156-v46"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/align-180.png"
    />

    <link
      rel="icon"
      href="/icon.svg"
      type="image/svg+xml"
    />

    <link
      rel="stylesheet"
      href="/styles.css?v=156-v46"
    />

    <link
      rel="stylesheet"
      href="/owner-builder.css?v=156-v46"
    />

    <title>Align V3.0 — Personal organiser</title>
  </head>

  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a
          class="brand"
          href="#home"
          aria-label="Align home"
        >
          <span class="brand-mark">A</span>
          <span>
            Align
            <small>V3.0</small>
          </span>
        </a>

        <div class="header-tools">
          <button
            type="button"
            id="connection-status"
            class="connection-status"
            aria-label="Open offline diagnostics"
            title="Offline status"
            hidden
          ></button>

          <button
            type="button"
            class="header-action header-install"
            id="install-button"
            aria-label="Install Align"
            title="Install Align"
            hidden
          >
            Install
          </button>
          <a class="header-action" href="/phone-notifications.html" aria-label="Phone notifications" title="Phone notifications">🔔</a>
        </div>
      </header>

      <main
        id="app"
        tabindex="-1"
        aria-live="polite"
      ></main>

      <nav
        class="tab-bar"
        aria-label="Main navigation"
        id="bottom-navigation"
      ></nav>
    </div>

    <div id="modal-root"></div>

    <div
      id="toast"
      role="status"
      aria-live="polite"
    ></div>

    <script src="/dates.js?v=156-v46"></script>
    <script src="/offline-store.js?v=156-v46"></script>
    <script src="/icloud.js?v=156-v46"></script>
    <script src="/builder-fields.js?v=156-v46"></script>
    <script src="/builder-finance.js?v=156-v46"></script>
    <script src="/builder-runtime.js?v=156-v46"></script>
    <script src="/journey-breakdown.js?v=156-v46"></script>
    <script src="/personal-planner.js?v=156-v46"></script>
    <script src="/travel-assets.js?v=156-v46"></script>
    <script src="/post-event-travel.js?v=156-v46"></script>
    <script src="/app.js?v=156-v46"></script>
    <script src="/build152.js?v=156-v46"></script>
  </body>
</html>
